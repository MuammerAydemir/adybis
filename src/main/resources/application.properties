spring.application.name=adybis
### DATASOURCE ###
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


### Java Mail Sender ###
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

### Thymeleaf ###
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

### Swagger ###
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

### JPA ###
spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.forma_sql=true
spring.jpa.open-in-view=false


### FLYWAY ###
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${POSTGRES_USER}
spring.flyway.password=${POSTGRES_PASSWORD}
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

### JWT ###
app.jwtSecretKey=${JWT_SECRET_KEY} 
app.jwtExpirationTime=${JWT_EXPIRATION_TIME}

app.baseUrl=${API_BASE_URL}